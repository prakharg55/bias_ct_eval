[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcue"
version = "0.1.0"
description = "Code for the paper Consistency Training Suppresses Cue Following Without Teaching Cue Selectivity"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
